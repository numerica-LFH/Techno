    {
      "titre": "Je recherche",

    {
      "titre": "Le langage binaire",
      "html": "\n<p>Un circuit électronique sait distinguer deux états : le courant passe, ou il ne passe pas. On les\nnote <b>1</b> et <b>0</b>. Chacun de ces chiffres s'appelle un <b>bit</b>.</p>\n<p>Un bit seul ne dit pas grand-chose. En les groupant, on multiplie les combinaisons possibles.</p>\n<div class=\"app-tableau-defilant\">\n<table>\n<tr><th>Nombre de bits</th><th>Combinaisons</th><th>Ce que cela permet</th></tr>\n<tr><td>1</td><td>2</td><td>Allumé ou éteint</td></tr>\n<tr><td>2</td><td>4</td><td>Quatre directions</td></tr>\n<tr><td>4</td><td>16</td><td>Seize niveaux de gris</td></tr>\n<tr><td>8, soit 1 octet</td><td>256</td><td>Un caractère, ou une nuance de rouge</td></tr>\n</table>\n</div>\n<p>Huit bits forment un <b>octet</b>. C'est l'unité de base : une lettre occupe un octet, une couleur\nd'image en occupe trois, un pour le rouge, un pour le vert, un pour le bleu.</p>\n<h3>Compter en binaire</h3>\n<p>Chaque position vaut le double de la précédente, en partant de la droite.</p>\n<div class=\"app-tableau-defilant\">\n<table>\n<tr><th>Position</th><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>\n<tr><th>Exemple : 1 0 0 1 0 1 1 0</th><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td></tr>\n</table>\n</div>\n<p>128 + 16 + 4 + 2 = 150. Le nombre binaire 10010110 vaut donc 150 en décimal.</p>\n"

    {
      "titre": "Le stockage",
      "html": "\n<p>Les multiples de l'octet servent à mesurer ce que contient un support.</p>\n<div class=\"app-tableau-defilant\">\n<table>\n<tr><th>Unité</th><th>Valeur</th><th>Ordre de grandeur</th></tr>\n<tr><td>1 kilooctet (ko)</td><td>1 000 octets</td><td>Une page de texte</td></tr>\n<tr><td>1 mégaoctet (Mo)</td><td>1 000 ko</td><td>Une photo de téléphone</td></tr>\n<tr><td>1 gigaoctet (Go)</td><td>1 000 Mo</td><td>Deux heures de vidéo compressée</td></tr>\n<tr><td>1 téraoctet (To)</td><td>1 000 Go</td><td>Un disque dur d'ordinateur portable</td></tr>\n</table>\n</div>\n<div class=\"app-grille\">\n<div class=\"app-vignette\"><b>Mémoire vive</b>Rapide, elle s'efface à l'extinction. Elle sert au travail en cours.</div>\n<div class=\"app-vignette\"><b>Disque et clé USB</b>Plus lents, ils conservent les données sans alimentation.</div>\n<div class=\"app-vignette\"><b>Serveur distant</b>Le fichier est chez quelqu'un d'autre. Il faut du réseau pour y accéder, et faire confiance.</div>\n</div>\n<div class=\"app-encadre\">\n<p><b>À retenir pour plus tard.</b> Un fichier déposé sur un service en ligne laisse une trace, même\naprès suppression. Ce point est repris au chapitre sur les réseaux.</p>\n</div>\n"

    {
      "titre": "Fichiers, tableaux et CSV",
