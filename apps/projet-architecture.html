      "titre": "La mission",
      "html": "\n<p>Chaque groupe choisit un espace réel du lycée, le mesure, le dessine à l'échelle, puis le\nreconstruit en trois dimensions avec un logiciel de plan.</p>\n<div class=\"app-grille\">\n<div class=\"app-vignette\"><b>Groupe 1</b>La salle de classe</div>\n<div class=\"app-vignette\"><b>Groupe 2</b>La salle des professeurs</div>\n<div class=\"app-vignette\"><b>Groupe 3</b>Le bureau de la vie scolaire</div>\n<div class=\"app-vignette\"><b>Groupe 4</b>Le hall de l'administration</div>\n</div>\n<div class=\"app-encadre\">\n<p><b>Livrables attendus.</b> Un relevé papier coté, un plan 2D à l'échelle, une vue 3D, et une\nprésentation orale de trois minutes devant la classe.</p>\n</div>\n"

    {
      "titre": "Étape 1. Relever les mesures",
      "html": "\n<p>Une heure. On mesure avant de dessiner, jamais l'inverse.</p>\n<h3>Le protocole</h3>\n<div class=\"app-encadre\">\n<p>1. Faire d'abord un croquis à main levée, sans souci de proportion.<br>\n2. Repérer sur ce croquis les longueurs à mesurer, et leur donner un numéro.<br>\n3. Mesurer chaque longueur deux fois, par deux personnes différentes.<br>\n4. Noter la valeur en centimètres, jamais en pas ni en carreaux.<br>\n5. Faire la somme des longueurs partielles d'un mur et la comparer à la mesure totale du mur.</p>\n</div>\n<h3>Ce qu'il faut relever</h3>\n<div class=\"app-tableau-defilant\">\n<table>\n<tr><th>Élément</th><th>Mesures à prendre</th></tr>\n<tr><td>Chaque mur</td><td>Longueur totale, hauteur sous plafond</td></tr>\n<tr><td>Chaque porte</td><td>Largeur, hauteur, distance au coin le plus proche, sens d'ouverture</td></tr>\n<tr><td>Chaque fenêtre</td><td>Largeur, hauteur, hauteur d'allège</td></tr>\n<tr><td>Mobilier fixe</td><td>Encombrement au sol et distance aux murs</td></tr>\n</table>\n</div>\n<div class=\"app-encadre\">\n<p><b>Contrôle.</b> Si la somme des mesures partielles s'écarte de plus de 2 cm de la mesure totale,\non recommence. Un écart accepté ici devient une erreur impossible à rattraper à l'étape 3.</p>\n</div>\n"
    },
    {
      "titre": "Étape 2. Le croquis à l'échelle",
      "html": "\n<p>Une échelle est un rapport entre la longueur dessinée et la longueur réelle.</p>\n<div class=\"app-tableau-defilant\">\n<table>\n<tr><th>Échelle</th><th>1 cm sur le papier vaut</th><th>Usage</th></tr>\n<tr><td>1:20</td><td>20 cm</td><td>Un meuble, une pièce très petite</td></tr>\n<tr><td>1:50</td><td>50 cm</td><td>Une salle de classe sur une feuille A3</td></tr>\n<tr><td>1:100</td><td>1 m</td><td>Un étage entier</td></tr>\n</table>\n</div>\n<h3>Deux calculs à savoir faire</h3>\n<div class=\"app-encadre\">\n<p><b>Du réel vers le papier.</b> Un mur de 7,20 m à l'échelle 1:50 : 720 ÷ 50 = 14,4 cm.<br>\n<b>Du papier vers le réel.</b> Un segment de 9 cm à l'échelle 1:50 : 9 × 50 = 450 cm, soit 4,50 m.</p>\n</div>\n<p>Sur le plan, chaque longueur porte sa <b>cote</b> : la valeur réelle écrite au-dessus d'une ligne\nde cote. On cote toujours la réalité, jamais la mesure du dessin.</p>\n"
    },
    {
      "titre": "Étape 3. Le modèle 3D",

    },

          ],
          "bonne": 1,

        },
        {

          "choix": [

            "La souris ne permet pas la précision au centimètre",
            "Le logiciel l'exige"
