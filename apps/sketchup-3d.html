<script>
/* Calculateur d'impact de l'impression 3D. Il se branche quand le moteur a fini de construire la page. */
document.addEventListener("app-pret", function () {
  var champs = ["c-poids", "c-prix", "c-puissance", "c-remplissage", "c-duree"].map(function (id) {
    return document.getElementById(id);
  });
  if (champs.some(function (c) { return !c; })) { return; }

  function euro(v) { return v.toFixed(2).replace(".", ",") + " euro"; }

  function calculer() {
    var poids = Number(champs[0].value) || 0;
    var prix = Number(champs[1].value) || 0;
    var puissance = Number(champs[2].value) || 0;
    var remplissage = Number(champs[3].value) || 0;
    var duree = Number(champs[4].value) || 0;

    var masse = poids * (remplissage / 100);
    var heures = duree / 60;
    var kw = puissance / 1000;
    var matiere = (masse / 1000) * prix;
    var elec = kw * heures * 0.25;
    var co2 = kw * heures * 0.057;
    var volume = masse / 1.24;                       /* cm3, masse volumique du PLA */
    var section = Math.PI * Math.pow(0.175 / 2, 2);  /* cm2, fil de 1,75 mm */
    var filament = section > 0 ? (volume / section) / 100 : 0;

    document.getElementById("r-masse").textContent = masse.toFixed(1).replace(".", ",") + " g";
    document.getElementById("r-matiere").textContent = euro(matiere);
    document.getElementById("r-elec").textContent = euro(elec);
    document.getElementById("r-total").textContent = euro(matiere + elec);
    document.getElementById("r-co2").textContent = co2.toFixed(3).replace(".", ",") + " kg de CO2";
    document.getElementById("r-fil").textContent = filament.toFixed(1).replace(".", ",") + " m";
  }

  champs.forEach(function (c) { c.addEventListener("input", calculer); });
  calculer();
});
</script>
