      "titre": "Besoin et objet technique",
      "html": "\n<p>Un <b>besoin</b> est un manque que l'être humain cherche à satisfaire. Certains besoins viennent\ndu corps, d'autres de la vie en groupe, d'autres du confort. Ils changent selon le lieu où l'on vit,\nselon l'âge, et même selon le moment de la journée.</p>\n<p>Pour satisfaire un besoin, on utilise un <b>objet technique</b> : un objet fabriqué par l'être\nhumain. Le service qu'il rend s'appelle sa <b>fonction d'usage</b>. Elle s'écrit toujours par un\nverbe à l'infinitif : permettre de, protéger de, transporter.</p>\n<div class=\"app-tableau-defilant\">\n<table>\n<tr><th>Objet technique</th><th>Fonction d'usage</th><th>Besoin satisfait</th></tr>\n<tr><td>Une perceuse</td><td>Percer un matériau</td><td>Construire, réparer</td></tr>\n<tr><td>Un stéthoscope</td><td>Écouter les bruits du corps</td><td>Se soigner</td></tr>\n<tr><td>Un pont</td><td>Franchir un obstacle</td><td>Se déplacer</td></tr>\n<tr><td>Un extincteur</td><td>Éteindre un début d'incendie</td><td>Se protéger</td></tr>\n</table>\n</div>\n<div class=\"app-encadre\">\n<p><b>Attention au piège.</b> La fonction d'usage d'un clavier n'est pas « taper sur des touches ».\nC'est « permettre à l'utilisateur de transmettre des informations à l'ordinateur ». On décrit le\nservice rendu, pas le geste.</p>\n</div>\n"
