site_name: Technologie & SNT
site_description: Ressources de technologie (cycle 4) et de SNT, Lycée franco-hondurien de Tegucigalpa
site_author: Thierry Quicroit
site_url: https://numerica-lfh.github.io/Techno/

repo_url: https://github.com/numerica-LFH/Techno
repo_name: numerica-LFH/Techno
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Lycée franco-hondurien de Tegucigalpa

theme:
  name: material
  language: fr
  # logo: assets/logo.png
  # favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

